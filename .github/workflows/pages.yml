name: Publish demo
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install numpy==2.3.5 pillow==12.1.0 playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run verify:numpy
      - name: Test the offline file and local project URL
        run: npm run e2e
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: publish
        uses: actions/deploy-pages@v5
      - name: Verify the published file and browser interactions
        env:
          DEMO_TEST_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          for attempt in {1..15}; do
            if curl -fsSL --max-time 20 "${DEMO_TEST_URL}?revision=${GITHUB_SHA}" -o "$RUNNER_TEMP/published.html" && cmp -s dist/index.html "$RUNNER_TEMP/published.html"; then
              npm run e2e
              exit $?
            fi
            sleep 5
          done
          echo 'The Pages response did not match the tested build.' >&2
          exit 1
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            .artifacts/browser/
            .artifacts/browser-public/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
